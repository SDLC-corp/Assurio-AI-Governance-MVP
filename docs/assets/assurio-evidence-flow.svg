<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc">
<title id="title">Make the basis for every decision visible</title><desc id="desc">System baselines connect to evidence and scoped decisions. Recorded changes mark linked evidence stale and decisions for reassessment.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#b29acb" stroke-width="1.5"/></marker></defs>
<rect x="1" y="1" width="1198" height="528" rx="20" fill="#faf8fd" stroke="#e8e1f0"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="38" y="40" fill="#8c6bb9" font-size="12" font-weight="600">ASSURIO / SDLC CORP</text><text x="38" y="80" fill="#30243f" font-size="28" font-weight="700">Make the basis for every decision visible</text><text x="38" y="112" fill="#77718a" font-size="16" font-weight="400">A model change should prompt a new review of the evidence behind a decision.</text><rect x="38" y="151" width="330" height="194" rx="14" fill="#ffffff" stroke="#e6e0ef"/><text x="61" y="184" fill="#9c7bbe" font-size="11" font-weight="600">01 / ASSURANCE RECORD</text><text x="61" y="220" fill="#3b2d4b" font-size="23" font-weight="600">System baseline</text><circle cx="65" cy="246" r="3" fill="#b69acb"/><text x="78" y="251" fill="#77718a" font-size="15" font-weight="400">Declared scope &amp; owner</text><circle cx="65" cy="275" r="3" fill="#b69acb"/><text x="78" y="280" fill="#77718a" font-size="15" font-weight="400">Model version &amp; limits</text><circle cx="65" cy="304" r="3" fill="#b69acb"/><text x="78" y="309" fill="#77718a" font-size="15" font-weight="400">Requirements &amp; controls</text><rect x="435" y="151" width="330" height="194" rx="14" fill="#ffffff" stroke="#e6e0ef"/><text x="458" y="184" fill="#9c7bbe" font-size="11" font-weight="600">02 / ASSURANCE RECORD</text><text x="458" y="220" fill="#3b2d4b" font-size="23" font-weight="600">Evidence record</text><circle cx="462" cy="246" r="3" fill="#b69acb"/><text x="475" y="251" fill="#77718a" font-size="15" font-weight="400">Evaluation findings</text><circle cx="462" cy="275" r="3" fill="#b69acb"/><text x="475" y="280" fill="#77718a" font-size="15" font-weight="400">Provenance &amp; SHA-256</text><circle cx="462" cy="304" r="3" fill="#b69acb"/><text x="475" y="309" fill="#77718a" font-size="15" font-weight="400">Review status &amp; validity</text><rect x="832" y="151" width="330" height="194" rx="14" fill="#ffffff" stroke="#e6e0ef"/><text x="855" y="184" fill="#9c7bbe" font-size="11" font-weight="600">03 / ASSURANCE RECORD</text><text x="855" y="220" fill="#3b2d4b" font-size="23" font-weight="600">Scoped decision</text><circle cx="859" cy="246" r="3" fill="#b69acb"/><text x="872" y="251" fill="#77718a" font-size="15" font-weight="400">Accountable owner</text><circle cx="859" cy="275" r="3" fill="#b69acb"/><text x="872" y="280" fill="#77718a" font-size="15" font-weight="400">Conditions &amp; review date</text><circle cx="859" cy="304" r="3" fill="#b69acb"/><text x="872" y="309" fill="#77718a" font-size="15" font-weight="400">Approval &amp; revision history</text><path d="M370 248H431" fill="none" stroke="#b29acb" stroke-width="2"  marker-end="url(#arrow)"/><path d="M766 248H828" fill="none" stroke="#b29acb" stroke-width="2"  marker-end="url(#arrow)"/><rect x="38" y="380" width="1124" height="86" rx="12" fill="#eee7f7" stroke="#dfd2ee"/><text x="61" y="413" fill="#8461a8" font-size="12" font-weight="700">CHANGE DETECTED</text><text x="61" y="442" fill="#4c385f" font-size="16" font-weight="600">New model, operating scope, or limits</text><path d="M438 423H500" fill="none" stroke="#b29acb" stroke-width="2"  marker-end="url(#arrow)"/><text x="523" y="413" fill="#8461a8" font-size="12" font-weight="700">EVIDENCE → STALE</text><text x="523" y="442" fill="#4c385f" font-size="16" font-weight="600">Review affected records</text><path d="M786 423H841" fill="none" stroke="#b29acb" stroke-width="2"  marker-end="url(#arrow)"/><text x="866" y="413" fill="#8461a8" font-size="12" font-weight="700">DECISION → REASSESS</text><text x="866" y="442" fill="#4c385f" font-size="16" font-weight="600">Record a fresh conclusion</text>
<text x="38" y="506" fill="#92859f" font-size="12" font-weight="400">Connected AI assurance</text><text x="1040" y="506" fill="#92859f" font-size="12" font-weight="400">sdlccorp.com</text></g></svg>
