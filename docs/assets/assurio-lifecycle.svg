<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc">
<title id="title">One connected assurance lifecycle</title><desc id="desc">Eight stages: Scope, Govern, Assess, Test, Evidence, Decide, Monitor change, and Reassess. Monitoring refers to recorded change events.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 7 4 1 7" fill="none" stroke="#b29acb" stroke-width="1.5"/></marker></defs>
<rect x="1" y="1" width="1198" height="548" rx="20" fill="#faf8fd" stroke="#e8e1f0"/>
<g font-family="Segoe UI, Arial, sans-serif"><text x="38" y="40" fill="#8c6bb9" font-size="12" font-weight="600">ASSURIO / SDLC CORP</text><text x="38" y="80" fill="#30243f" font-size="28" font-weight="700">One connected assurance lifecycle</text><text x="38" y="112" fill="#77718a" font-size="16" font-weight="400">A repeatable review cycle, from system scope to evidence-backed decisions.</text><rect x="38" y="148" width="266" height="150" rx="14" fill="#fff" stroke="#e3dbea"/><rect x="56" y="166" width="34" height="29" rx="8" fill="#f0eafa" stroke="#f0eafa"/><text x="63" y="186" fill="#9675bd" font-size="13" font-weight="600">01</text><text x="56" y="226" fill="#41324f" font-size="21" font-weight="600">Scope</text><text x="56" y="253" fill="#83778f" font-size="14" font-weight="400">Declare intended use</text><text x="56" y="274" fill="#83778f" font-size="14" font-weight="400">and operating limits.</text><path d="M305 223h17" fill="none" stroke="#b29acb" stroke-width="2"  marker-end="url(#arrow)"/><rect x="324" y="148" width="266" height="150" rx="14" fill="#fff" stroke="#e3dbea"/><rect x="342" y="166" width="34" height="29" rx="8" fill="#f0eafa" stroke="#f0eafa"/><text x="349" y="186" fill="#9675bd" font-size="13" font-weight="600">02</text><text x="342" y="226" fill="#41324f" font-size="21" font-weight="600">Govern</text><text x="342" y="253" fill="#83778f" font-size="14" font-weight="400">Assign owners, controls,</text><text x="342" y="274" fill="#83778f" font-size="14" font-weight="400">and review responsibilities.</text><path d="M591 223h17" fill="none" stroke="#b29acb" stroke-width="2"  marker-end="url(#arrow)"/><rect x="610" y="148" width="266" height="150" rx="14" fill="#fff" stroke="#e3dbea"/><rect x="628" y="166" width="34" height="29" rx="8" fill="#f0eafa" stroke="#f0eafa"/><text x="635" y="186" fill="#9675bd" font-size="13" font-weight="600">03</text><text x="628" y="226" fill="#41324f" font-size="21" font-weight="600">Assess</text><text x="628" y="253" fill="#83778f" font-size="14" font-weight="400">Record exposure, impact,</text><text x="628" y="274" fill="#83778f" font-size="14" font-weight="400">and mitigations.</text><path d="M877 223h17" fill="none" stroke="#b29acb" stroke-width="2"  marker-end="url(#arrow)"/><rect x="896" y="148" width="266" height="150" rx="14" fill="#fff" stroke="#e3dbea"/><rect x="914" y="166" width="34" height="29" rx="8" fill="#f0eafa" stroke="#f0eafa"/><text x="921" y="186" fill="#9675bd" font-size="13" font-weight="600">04</text><text x="914" y="226" fill="#41324f" font-size="21" font-weight="600">Test</text><text x="914" y="253" fill="#83778f" font-size="14" font-weight="400">Capture methods, metrics,</text><text x="914" y="274" fill="#83778f" font-size="14" font-weight="400">and observed results.</text><path d="M1029 299v40" fill="none" stroke="#b29acb" stroke-width="2"  marker-end="url(#arrow)"/><rect x="896" y="341" width="266" height="150" rx="14" fill="#fff" stroke="#e3dbea"/><rect x="914" y="359" width="34" height="29" rx="8" fill="#f0eafa" stroke="#f0eafa"/><text x="921" y="379" fill="#9675bd" font-size="13" font-weight="600">05</text><text x="914" y="419" fill="#41324f" font-size="21" font-weight="600">Evidence</text><text x="914" y="446" fill="#83778f" font-size="14" font-weight="400">Review provenance,</text><text x="914" y="467" fill="#83778f" font-size="14" font-weight="400">currency, and limitations.</text><path d="M895 416h-17" fill="none" stroke="#b29acb" stroke-width="2"  marker-end="url(#arrow)"/><rect x="610" y="341" width="266" height="150" rx="14" fill="#33234e" stroke="#33234e"/><rect x="628" y="359" width="34" height="29" rx="8" fill="#58416f" stroke="#58416f"/><text x="635" y="379" fill="#e7d7fd" font-size="13" font-weight="600">06</text><text x="628" y="419" fill="#fff" font-size="21" font-weight="600">Decide</text><text x="628" y="446" fill="#d0c1df" font-size="14" font-weight="400">Record an accountable,</text><text x="628" y="467" fill="#d0c1df" font-size="14" font-weight="400">scoped approval.</text><path d="M609 416h-17" fill="none" stroke="#b29acb" stroke-width="2"  marker-end="url(#arrow)"/><rect x="324" y="341" width="266" height="150" rx="14" fill="#fff" stroke="#e3dbea"/><rect x="342" y="359" width="34" height="29" rx="8" fill="#f0eafa" stroke="#f0eafa"/><text x="349" y="379" fill="#9675bd" font-size="13" font-weight="600">07</text><text x="342" y="419" fill="#41324f" font-size="21" font-weight="600">Monitor change</text><text x="342" y="446" fill="#83778f" font-size="14" font-weight="400">Record changes to models,</text><text x="342" y="467" fill="#83778f" font-size="14" font-weight="400">permissions, and context.</text><path d="M323 416h-17" fill="none" stroke="#b29acb" stroke-width="2"  marker-end="url(#arrow)"/><rect x="38" y="341" width="266" height="150" rx="14" fill="#fff" stroke="#e3dbea"/><rect x="56" y="359" width="34" height="29" rx="8" fill="#f0eafa" stroke="#f0eafa"/><text x="63" y="379" fill="#9675bd" font-size="13" font-weight="600">08</text><text x="56" y="419" fill="#41324f" font-size="21" font-weight="600">Reassess</text><text x="56" y="446" fill="#83778f" font-size="14" font-weight="400">Revisit affected evidence</text><text x="56" y="467" fill="#83778f" font-size="14" font-weight="400">and decision records.</text><path d="M171 341V301" fill="none" stroke="#b29acb" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="38" y="526" fill="#92859f" font-size="12" font-weight="400">Connected AI assurance</text><text x="1040" y="526" fill="#92859f" font-size="12" font-weight="400">sdlccorp.com</text></g></svg>
