none" stroke="#b29acb" stroke-width="2"  marker-end="url(#arrow)"/><path d="M793 358V430H840" fill="none" stroke="#b29acb" stroke-width="2"  marker-end="url(#arrow)"/><rect x="844" y="234" width="318" height="116" rx="14" fill="#ffffff" stroke="#e6e0ef"/><text x="868" y="268" fill="#9a7bbb" font-size="12" font-weight="600">D1 DATABASE</text><text x="868" y="302" fill="#3b2d4b" font-size="21" font-weight="600">Records &amp; audit history</text><text x="868" y="330" fill="#77718a" font-size="14" font-weight="400">Governance data and revisions</text><rect x="844" y="376" width="318" height="116" rx="14" fill="#ffffff" stroke="#e6e0ef"/><text x="868" y="410" fill="#9a7bbb" font-size="12" font-weight="600">R2 OBJECT STORAGE</text><text x="868" y="444" fill="#3b2d4b" font-size="21" font-weight="600">Evidence artifacts</text><text x="868" y="472" fill="#77718a" font-size="14" font-weight="400">Uploads and retained file versions</text><text x="38" y="533" fill="#77718a" font-size="14" font-weight="400">Local development uses separate D1 / R2 state on the developer machine.</text>
